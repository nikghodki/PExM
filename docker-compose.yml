version: "3.9"

services:
  # ── ContextOS Server ────────────────────────────────────────────────────────
  contextos:
    build:
      context: .
      dockerfile: Dockerfile
    image: contextos/server:dev
    ports:
      - "50051:50051"    # gRPC
      - "9090:9090"      # Prometheus metrics
    environment:
      CONTEXTOS_ROCKSDB_PATH: /data/rocksdb
      CONTEXTOS_LOG: info
      KAFKA_BROKERS: kafka:9092
    volumes:
      - contextos-data:/data
    depends_on:
      - kafka
    networks:
      - contextos-net

  # ── Apache Kafka (Memory Bus) ───────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - contextos-net

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - contextos-net

  # ── Prometheus ────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9091:9090"
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - contextos-net

  # ── Grafana ───────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/observability/grafana-dashboard.json:/etc/grafana/provisioning/dashboards/contextos.json:ro
    depends_on:
      - prometheus
    networks:
      - contextos-net

  # ── Jaeger ────────────────────────────────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.56
    ports:
      - "16686:16686"   # UI
      - "14268:14268"   # HTTP collector
      - "6831:6831/udp" # UDP agent
    networks:
      - contextos-net

volumes:
  contextos-data:
  grafana-data:

networks:
  contextos-net:
    driver: bridge
