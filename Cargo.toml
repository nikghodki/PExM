[workspace]
resolver = "2"
members = [
    "crates/kernel",
    "crates/indexer",
    "crates/graph",
    "crates/policy",
    "crates/scheduler",
    "crates/bus",
    "crates/optimizer",
    "crates/crdt",
    "crates/server",
    "cli",
    "tests/integration",
]

[workspace.package]
version      = "0.1.0"
edition      = "2021"
authors      = ["ContextOS Team"]
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/contextos/contextos"

[workspace.dependencies]
# Async runtime
tokio            = { version = "1", features = ["full"] }
tokio-stream     = { version = "0.1", features = ["sync"] }

# gRPC
tonic            = "0.12"
prost            = "0.13"
prost-types      = "0.13"

# Storage
rocksdb          = "0.22"

# AST / Code indexing
tree-sitter      = "0.22"

# Git
git2             = "0.19"

# Graph
petgraph         = "0.6"

# Serialization
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"

# Identifiers / time
uuid             = { version = "1", features = ["v4", "serde"] }
chrono           = { version = "0.4", features = ["serde"] }

# CLI
clap             = { version = "4", features = ["derive", "env"] }

# Logging / tracing
tracing          = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Error handling
anyhow           = "1"
thiserror        = "1"

# Observability (Phase 3)
metrics          = "0.22"
metrics-exporter-prometheus = "0.13"
opentelemetry    = { version = "0.22", features = ["trace"] }

# CRDT (Phase 3)
crdts            = "7"

# Hashing / compression
xxhash-rust      = { version = "0.8", features = ["xxh3"] }
zstd             = "0.13"
tower            = "0.4"
http             = "1"

# Build deps (declared here so crates can reference them)
[workspace.metadata]
protoc-required = true
