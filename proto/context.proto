syntax = "proto3";
package contextos.context.v1;

import "google/protobuf/empty.proto";

option java_package        = "io.contextos.context.v1";
option java_multiple_files = true;

// ─── Eviction policy ──────────────────────────────────────────────────────────
enum EvictionPolicy {
  EVICTION_POLICY_UNSPECIFIED = 0;
  LRU                         = 1;
  SCORE                       = 2;
  FIFO                        = 3;
  HYBRID                      = 4;
}

// ─── Context structures ───────────────────────────────────────────────────────
message ContextEntry {
  string  id            = 1;
  string  content       = 2;
  float   relevance     = 3;
  int32   token_count   = 4;
  string  source_tier   = 5;
  string  source_id     = 6;
}

message ContextWindow {
  string   session_id      = 1;
  int32    total_tokens     = 2;
  int32    budget_tokens    = 3;
  repeated ContextEntry entries = 4;
  string   eviction_policy = 5;
}

// ─── Requests / Responses ─────────────────────────────────────────────────────
message ScheduleContextRequest {
  string   agent_id        = 1;
  string   session_id      = 2;
  int32    token_budget     = 3;
  EvictionPolicy policy    = 4;
  repeated string query_hints = 5;
}
message ScheduleContextResponse {
  ContextWindow window     = 1;
  int64         latency_ms = 2;
}

message GetContextWindowRequest { string session_id = 1; }

message UpdateContextRequest {
  string   session_id = 1;
  string   entry_id   = 2;
  float    new_score  = 3;
}
message UpdateContextResponse { bool ok = 1; }

message CloseSessionRequest { string session_id = 1; }

message EvictRequest {
  string   session_id      = 1;
  EvictionPolicy policy    = 2;
  int32    target_tokens   = 3;
}
message EvictResponse {
  int32  evicted_count  = 1;
  int32  freed_tokens   = 2;
}

// ─── Service ──────────────────────────────────────────────────────────────────
service ContextSchedulerService {
  rpc ScheduleContext    (ScheduleContextRequest)    returns (ScheduleContextResponse);
  rpc GetContextWindow   (GetContextWindowRequest)   returns (ContextWindow);
  rpc UpdateContext      (UpdateContextRequest)      returns (UpdateContextResponse);
  rpc CloseSession       (CloseSessionRequest)       returns (google.protobuf.Empty);
  rpc Evict              (EvictRequest)              returns (EvictResponse);
}
