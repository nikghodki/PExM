syntax = "proto3";
package contextos.optimizer.v1;

import "google/protobuf/empty.proto";

option java_package        = "io.contextos.optimizer.v1";
option java_multiple_files = true;

// ─── Optimizer types ──────────────────────────────────────────────────────────
message PromotionSuggestion {
  string memory_id    = 1;
  string reason       = 2;
  string target_tier  = 3;
  float  confidence   = 4;
}

message CompressionResult {
  string   memory_id      = 1;
  bool     compressed     = 2;
  int32    before_tokens  = 3;
  int32    after_tokens   = 4;
  string   summary        = 5;
}

// ─── Requests / Responses ─────────────────────────────────────────────────────
message GetPromotionSuggestionsRequest {
  string   agent_id = 1;
  int32    limit    = 2;
}
message GetPromotionSuggestionsResponse {
  repeated PromotionSuggestion suggestions = 1;
}

message TriggerCompressionRequest {
  string   memory_id = 1;
  string   strategy  = 2;  // "summary" | "delta" | "auto"
}
message TriggerCompressionResponse {
  CompressionResult result = 1;
}

// ─── Service ──────────────────────────────────────────────────────────────────
service OptimizerService {
  rpc GetPromotionSuggestions (GetPromotionSuggestionsRequest) returns (GetPromotionSuggestionsResponse);
  rpc TriggerCompression      (TriggerCompressionRequest)      returns (TriggerCompressionResponse);
}
