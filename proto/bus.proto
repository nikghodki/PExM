syntax = "proto3";
package contextos.bus.v1;

import "google/protobuf/timestamp.proto";

option java_package        = "io.contextos.bus.v1";
option java_multiple_files = true;

// ─── Event types ─────────────────────────────────────────────────────────────
enum MemoryEventKind {
  MEMORY_EVENT_KIND_UNSPECIFIED = 0;
  MEMORY_CREATED                = 1;
  MEMORY_UPDATED                = 2;
  MEMORY_PROMOTED               = 3;
  MEMORY_ARCHIVED               = 4;
  SCOPE_SHARED                  = 5;
  AGENT_SUBSCRIBED              = 6;
  AGENT_UNSUBSCRIBED            = 7;
}

message MemoryEvent {
  string           event_id   = 1;
  MemoryEventKind  kind       = 2;
  string           memory_id  = 3;
  string           agent_id   = 4;
  string           scope      = 5;
  map<string, string> payload = 6;
  google.protobuf.Timestamp occurred_at = 7;
}

// ─── Requests / Responses ─────────────────────────────────────────────────────
message PublishEventRequest  { MemoryEvent event = 1; }
message PublishEventResponse { bool ok = 1; string event_id = 2; }

message SubscribeRequest {
  string   agent_id       = 1;
  repeated MemoryEventKind event_kinds = 2;
  string   scope_filter   = 3;
}

// ─── Service ──────────────────────────────────────────────────────────────────
service MemoryBusService {
  rpc PublishEvent (PublishEventRequest)  returns (PublishEventResponse);
  rpc Subscribe    (SubscribeRequest)     returns (stream MemoryEvent);
}
