[package]
name        = "contextos-server"
description = "ContextOS gRPC server binary"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "contextos-server"
path = "src/main.rs"

[dependencies]
tokio            = { workspace = true }
tokio-stream     = { workspace = true }
tonic            = { workspace = true }
prost            = { workspace = true }
prost-types      = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }
uuid             = { workspace = true }
chrono           = { workspace = true }
tracing          = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow           = { workspace = true }
thiserror        = { workspace = true }
tower            = { workspace = true }
http             = { workspace = true }
tonic-health     = "0.12"
bytes            = "1"
walkdir          = "2"

# Internal crates
contextos-kernel    = { path = "../kernel" }
contextos-indexer   = { path = "../indexer" }
contextos-graph     = { path = "../graph" }
contextos-policy    = { path = "../policy" }
contextos-scheduler = { path = "../scheduler" }
contextos-bus       = { path = "../bus" }
contextos-optimizer = { path = "../optimizer" }

futures-core        = "0.3"

[build-dependencies]
tonic-build = { version = "0.12" }
