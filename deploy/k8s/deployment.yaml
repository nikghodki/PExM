apiVersion: apps/v1
kind: Deployment
metadata:
  name: contextos-server
  namespace: contextos
  labels:
    app: contextos-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: contextos-server
  template:
    metadata:
      labels:
        app: contextos-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port:   "9090"
    spec:
      containers:
        - name: contextos-server
          image: contextos/server:latest
          ports:
            - name: grpc
              containerPort: 50051
            - name: metrics
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: contextos-config
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu:    "500m"
              memory: "512Mi"
            limits:
              cpu:    "2"
              memory: "4Gi"
          readinessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: contextos-data
