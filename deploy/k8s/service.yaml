apiVersion: v1
kind: Service
metadata:
  name: contextos-server
  namespace: contextos
spec:
  selector:
    app: contextos-server
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
      protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: contextos-server-lb
  namespace: contextos
spec:
  selector:
    app: contextos-server
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
  type: LoadBalancer
