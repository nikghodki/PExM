apiVersion: v1
kind: Service
metadata:
  name: {{ include "contextos.fullname" . }}
  labels: {{ include "contextos.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{ include "contextos.selectorLabels" . | nindent 4 }}
  ports:
    - name: grpc
      port: {{ .Values.service.grpcPort }}
      targetPort: grpc
    - name: metrics
      port: {{ .Values.service.metricsPort }}
      targetPort: metrics
