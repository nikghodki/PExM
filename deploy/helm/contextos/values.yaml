replicaCount: 2

image:
  repository: contextos/server
  pullPolicy:  IfNotPresent
  tag:         "latest"

service:
  type: ClusterIP
  grpcPort: 50051
  metricsPort: 9090

resources:
  requests:
    cpu:    "500m"
    memory: "512Mi"
  limits:
    cpu:    "2"
    memory: "4Gi"

autoscaling:
  enabled:     true
  minReplicas: 2
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70

persistence:
  enabled:      true
  size:         "50Gi"
  storageClass: ""

env:
  CONTEXTOS_LOG:          "info"
  CONTEXTOS_ROCKSDB_PATH: "/data/rocksdb"
  KAFKA_BROKERS:          "kafka:9092"

nodeSelector: {}
tolerations:  []
affinity:     {}
