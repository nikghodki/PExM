global:
  scrape_interval:     15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: contextos-server
    static_configs:
      - targets: ["contextos:9090"]
    metrics_path: /metrics

  - job_name: kafka
    static_configs:
      - targets: ["kafka:9092"]

rule_files:
  - "rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []
